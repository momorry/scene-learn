http {
    # ================= 1. 基础限流配置 =================
    # 定义限流区域：按客户端IP（二进制格式更省内存），10MB内存约存16万个IP状态
    # rate=100r/m：平均每分钟允许100次请求（约1.67次/秒），采用漏桶算法平滑处理
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # 自定义限流返回状态码：默认是503，改为403（Forbidden）更符合你的需求
    limit_req_status 403;

    # ================= 2. 安全 CORS 跨域配置 =================
    # 使用 map 模块动态匹配可信域名白名单，支持多个前端域名
    # 只有匹配成功的域名才会被赋值给 $cors_origin，未匹配的默认为空字符串
    map $http_origin $cors_origin {
        default "";
        "~^https?://(www\.myapp\.com|admin\.myapp\.com)$" $http_origin;
    }

    server {
        listen 80;
        server_name api.myapp.com;

        # ================= 3. API 接口限流 + 跨域 =================
        location /api/ {
            # 应用限流规则：引用上面定义的 api_limit 区域
            # burst=10：允许突发10个请求进入缓冲区
            # nodelay：突发请求立即处理，不排队延迟，提升用户体验
            limit_req zone=api_limit burst=10 nodelay;

            # CORS 跨域响应头（必须带 always 参数，确保4xx/5xx错误响应也携带跨域头）
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 3600 always;  # 预检请求缓存1小时，减少重复OPTIONS

            # 处理 OPTIONS 预检请求：直接返回204，不转发到后端
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # 反向代理到后端服务
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ================= 4. 静态资源（不限流，可放宽跨域） =================
        location ~* \.(jpg|png|css|js|ico|woff2)$ {
            # 静态资源通常不需要携带凭证，可以用 * 或指定 CDN 域名
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Max-Age' 86400 always;  # 缓存24小时

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            root /usr/share/nginx/html;
            expires 30d;  # 静态资源缓存30天
        }
    }
}